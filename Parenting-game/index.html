<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parenting - 가족의 하루를 지켜라</title>
<style>
html,body{margin:0;min-height:100%;background:#0b0b16;color:#f7f0dc;font-family:system-ui,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;max-width:100%;padding:4px;box-sizing:border-box}
.directions{display:grid;grid-template-columns:repeat(3,44px);gap:4px}
.directions button:first-child{grid-column:2}
.directions button:nth-child(2){grid-column:1}
.actions{display:flex;flex-wrap:wrap;gap:6px;max-width:230px}
button{min-width:44px;min-height:44px;border:2px solid #75668f;border-radius:6px;background:#29243a;color:#fff;font:700 14px system-ui;touch-action:none;user-select:none;cursor:pointer}
button:active{background:#6c526a}
button:focus-visible{outline:3px solid #f2d05a;outline-offset:2px}
#action{background:#f2d05a;color:#211b29;padding:0 16px}
@media(max-height:500px){.directions{display:flex}.actions{max-width:none}#controls{gap:6px}}
@media(max-width:400px){#controls{gap:6px}.actions{max-width:180px}}
[hidden]{display:none!important}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;box-shadow:0 0 0 4px #241a3a,0 0 40px #7b2cbf55}
</style>
</head>
<body>
<canvas id="game" width="960" height="540" role="img" aria-label="Parenting: 가족의 하루를 지켜라. 방향키로 이동, E로 행동, Q로 내려놓기, P로 일시정지.">이 게임은 Canvas를 지원하는 브라우저가 필요해요.</canvas>
<nav id="controls" aria-label="게임 조작">
  <div class="directions" aria-label="방향">
    <button data-key="arrowup" aria-label="위로 이동">↑</button>
    <button data-key="arrowleft" aria-label="왼쪽 이동 또는 아빠 선택">←</button>
    <button data-key="arrowdown" aria-label="아래로 이동">↓</button>
    <button data-key="arrowright" aria-label="오른쪽 이동 또는 엄마 선택">→</button>
  </div>
  <div class="actions">
    <button id="action" data-key="e">시작 ▶</button>
    <button data-key="q">내려놓기 Q</button>
    <button id="pause" hidden>잠깐 쉬기 Ⅱ</button>
  </div>
</nav>
<script src="assets.js"></script>
<script src="game.js"></script>
</body>
</html>
